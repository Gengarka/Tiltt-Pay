server {
    listen 80;
    server_name tilt-pay.localhost;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name tilt-pay.localhost;
    client_max_body_size 10M; 

    ssl_certificate /etc/nginx/certs/tilt-pay.localhost.pem;
    ssl_certificate_key /etc/nginx/certs/tilt-pay.localhost-key.pem;

    location /api/ {
        proxy_pass http://backend:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
    }
}