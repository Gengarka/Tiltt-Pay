services:
  backend:
    build: ./backend
    container_name: tilt_pay_backend
    ports:
      - "3001:3001"
    volumes:
      - ./backend:/app
      - /app/node_modules
    env_file:
      - ./backend/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build: ./frontend
    container_name: tilt_pay_frontend
    ports:
      - "8080:80"
    depends_on:
      - backend