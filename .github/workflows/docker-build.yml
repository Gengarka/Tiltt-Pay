
name: Docker Build CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Backend Docker Image
        run: docker build -t tilt-pay-backend ./backend

      - name: Build Frontend Docker Image
        run: docker build --build-arg VITE_API_URL=/api -t tilt-pay-frontend ./frontend